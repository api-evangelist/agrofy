apis:
- aid: agrofy:agrofy-marketplace-api
  name: Agrofy Marketplace API
  description: 'Agrofy Developers is the company''s marketed partner-integration program
    for marketplace sellers — listing management, lead management and catalog synchronisation.
    Agrofy publishes no machine-readable contract for it: the portal at developers.agrofy.com
    is a static brochure that routes API documentation to eight per-country hosts
    (developers.agrofy.com.ar/docs and siblings), none of which resolve in DNS, and
    its own onboarding requires contacting an Agrofy advisor to be provisioned before
    a reference guide is shared. The baseURL recorded here is the first-party AWS API
    Gateway that the Argentine marketplace front end calls, observed in the markup
    of https://www.agrofy.com.ar/ and confirmed live (GET /api/main-menu/list returned
    HTTP 200 application/json unauthenticated on 2026-09-13); Agrofy''s own developer
    material does not name a base URL, and no OpenAPI, Swagger, GraphQL SDL or AsyncAPI
    was found on any Agrofy host.'
  image: https://www.agrofy.com/imagenes/logo-agrofy-sin-tag.png
  humanURL: https://developers.agrofy.com/
  baseURL: https://apigateway-argentina.agrofy.com
