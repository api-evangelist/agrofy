aid: agrofy
name: Agrofy
description: 'Agrofy is a Latin American agribusiness technology company founded in
  2015 in Rosario, Argentina, operating the region''s largest online marketplace for
  agricultural inputs, machinery, farmland, vehicles and services. The company runs
  three business units — Agrofy Market (the marketplace, live in Argentina and Brazil
  with country storefronts across Bolivia, Chile, Colombia, Paraguay, Peru and Uruguay),
  Agrofy News (an agricultural news publication) and Agrofy Pay (payments, credit and
  financing for agribusiness transactions). Agrofy markets a partner integration program,
  Agrofy Developers, for sellers who want to automate listings and lead management
  inside the marketplace.'
